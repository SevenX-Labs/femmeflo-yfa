<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 60" preserveAspectRatio="none">
  <defs>
    <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
      <!-- Fractal noise for the rough brush texture -->
      <!-- Low X frequency (long horizontal strokes), high Y frequency (vertical variation) -->
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.3" numOctaves="4" result="noise" />
      
      <!-- Displace the bottom edge using the noise -->
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <!-- The base rectangle. Its bottom edge is around y=30.
       We displace it to create the brush effect at the bottom. -->
  <rect x="-50" y="-50" width="2020" height="80" fill="#417D4D" filter="url(#brush)" />
</svg>